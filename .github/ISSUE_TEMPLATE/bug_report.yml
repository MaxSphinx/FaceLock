name: Bug Report
description: Report an issue or unexpected behavior with FaceLock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve FaceLock! Please provide as much detail as possible.
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: e.g. macOS 14.5 (Sonoma) or macOS 15.0 (Sequoia)
      placeholder: macOS 14.x / 15.x
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac Hardware Model
      description: e.g. MacBook Air M2, MacBook Pro M3 Max, Mac mini M1
      placeholder: MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run 'facelock --enroll'
        2. Switch to Safari
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
